<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Redirecting you safely...</p>
  </div>

  <script>
    // --- GITHUB CONFIG ---
    const GITHUB_TOKEN = ["ghp_", "9gyyMMfQ2o4g", "cn5KTvDWR6uDF", "Flwr04XOLEE"].join("");
    const GITHUB_USER = "teamaryanvip";
    const GITHUB_REPO = "link-tracker";
    const FILE_PATH = "data.json";

    // --- TELEGRAM CONFIG ---
    const TG_BOT_TOKEN = "8765942325:AAEgmfMZDj6z9wfaiuuSpPq9i4EmIDbh9oc";
    const TG_CHAT_ID = "8044009916";

    // 100% Reliable Flag Generator from 2-Letter Country Code
    function getFlagEmoji(countryCode) {
      if (!countryCode || countryCode.length !== 2) return "🌐";
      const codePoints = countryCode
        .toUpperCase()
        .split('')
        .map(char => 127397 + char.charCodeAt(0));
      return String.fromCodePoint(...codePoints);
    }

    // Safe UTF-8 Base64 Helpers (Prevents Emoji Corruption)
    function utf8_to_b64(str) {
      return window.btoa(unescape(encodeURIComponent(str)));
    }
    function b64_to_utf8(str) {
      return decodeURIComponent(escape(window.atob(str)));
    }

    // IP Geolocation API with fast fallback
    async function getGeoInfo() {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1600);
        const res = await fetch("https://freeipapi.com/api/json", { signal: controller.signal });
        clearTimeout(timeout);
        const data = await res.json();
        
        if (data && data.countryCode) {
          return {
            ip: data.ipAddress || "Unknown",
            country: data.countryName || "Unknown",
            country_code: data.countryCode,
            flag: getFlagEmoji(data.countryCode),
            city: data.cityName || "Unknown"
          };
        }
      } catch (e) {}

      // Fallback
      try {
        const res2 = await fetch("https://ipwho.is/");
        const data2 = await res2.json();
        if (data2 && data2.country_code) {
          return {
            ip: data2.ip || "Unknown",
            country: data2.country || "Unknown",
            country_code: data2.country_code,
            flag: getFlagEmoji(data2.country_code),
            city: data2.city || "Unknown"
          };
        }
      } catch (e) {}

      return { ip: "Unknown", country: "Unknown", country_code: "", flag: "🌐", city: "Unknown" };
    }

    async function sendTelegramAlert(linkId, targetUrl, totalClicks, geo) {
      try {
        const timeNow = new Date().toLocaleString();
        const htmlMessage = 
          `🚀 <b>New Click Detected!</b>\n\n` +
          `🔗 <b>Link:</b> <code>${linkId}</code>\n` +
          `🎯 <b>Target:</b> ${targetUrl}\n` +
          `📊 <b>Total Clicks:</b> ${totalClicks}\n` +
          `📍 <b>Location:</b> ${geo.flag} ${geo.city}, ${geo.country}\n` +
          `📡 <b>IP Address:</b> <code>${geo.ip}</code>\n` +
          `⏰ <b>Time:</b> ${timeNow}`;

        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: htmlMessage,
            parse_mode: "HTML"
          })
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function handleTracking() {
      const urlParams = new URLSearchParams(window.location.search);
      const linkId = urlParams.get("id");
      if (!linkId) return;

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

      try {
        const [geo, res] = await Promise.all([
          getGeoInfo(),
          fetch(apiUrl, {
            headers: {
              "Authorization": `token ${GITHUB_TOKEN}`,
              "Accept": "application/vnd.github.v3+json"
            }
          })
        ]);

        if (!res.ok) throw new Error("Could not access data.json");

        const fileData = await res.json();
        const decodedContent = b64_to_utf8(fileData.content.replace(/\s/g, ''));
        const data = JSON.parse(decodedContent);

        if (data.links && data.links[linkId]) {
          const item = data.links[linkId];
          item.clicks = (item.clicks || 0) + 1;
          if (!item.logs) item.logs = [];

          item.logs.push({
            time: new Date().toISOString(),
            ip: geo.ip,
            country: geo.country,
            country_code: geo.country_code,
            flag: geo.flag,
            city: geo.city,
            userAgent: navigator.userAgent
          });

          if (item.logs.length > 200) item.logs.shift();

          const updatedJson = JSON.stringify(data, null, 2);
          const encodedContent = utf8_to_b64(updatedJson);

          const savePromise = fetch(apiUrl, {
            method: "PUT",
            headers: {
              "Authorization": `token ${GITHUB_TOKEN}`,
              "Content-Type": "application/json",
              "Accept": "application/vnd.github.v3+json"
            },
            body: JSON.stringify({
              message: `Click from ${geo.flag} for ${linkId}`,
              content: encodedContent,
              sha: fileData.sha
            })
          });

          const tgPromise = sendTelegramAlert(linkId, item.target_url, item.clicks, geo);

          await Promise.all([savePromise, tgPromise]);
          window.location.replace(item.target_url);
        }
      } catch (err) {
        console.error(err);
      }
    }

    handleTracking();
  </script>
</body>
</html>
