<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f7f9fa;
      color: #333;
    }
    .box {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>Redirecting...</h3>
    <p>Please wait a moment while we transfer you.</p>
  </div>

  <script>
    // --- YOUR PRE-CONFIGURED SETTINGS ---
    const GITHUB_TOKEN = "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";
    const GITHUB_USER = "teamaryanvip";
    const GITHUB_REPO = "link-tracker";
    const FILE_PATH = "data.json";
    // ------------------------------------

    const urlParams = new URLSearchParams(window.location.search);
    const linkId = urlParams.get("id");

    async function handleTracking() {
      if (!linkId) {
        document.body.innerHTML = "<h3>Error: No link ID provided in the URL.</h3>";
        return;
      }

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

        // 1. Fetch current data.json from your GitHub Repo
        const res = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github+json"
          }
        });

        if (!res.ok) {
          throw new Error("Could not access data.json from repository.");
        }

        const fileData = await res.json();
        
        // Decode base64 content
        const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
        const data = JSON.parse(decodedContent);

        if (data.links && data.links[linkId]) {
          const item = data.links[linkId];

          // 2. Increment click count and add log entry
          item.clicks = (item.clicks || 0) + 1;
          if (!item.logs) item.logs = [];
          item.logs.push({
            time: new Date().toISOString(),
            userAgent: navigator.userAgent
          });

          // 3. Encode updated JSON back to base64
          const updatedJson = JSON.stringify(data, null, 2);
          const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

          // 4. Save and commit updated data back to GitHub
          await fetch(apiUrl, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${GITHUB_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: `Click recorded for link: ${linkId}`,
              content: encodedContent,
              sha: fileData.sha
            })
          });

          // 5. Redirect the visitor to the target destination
          window.location.replace(item.target_url);
        } else {
          document.body.innerHTML = "<h3>Error: Link ID not found in database.</h3>";
        }
      } catch (err) {
        console.error(err);
        document.body.innerHTML = "<h3>Failed to load destination. Please try again.</h3>";
      }
    }

    handleTracking();
  </script>
</body>
</html>
