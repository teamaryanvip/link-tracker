<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f7f9fa;
      color: #333;
      text-align: center;
    }
    .error-box {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: left;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">
    <h3>Checking link...</h3>
    <p>Please wait a moment.</p>
  </div>

  <div id="debug" class="error-box" style="display: none;"></div>

  <script>
    // Configuration
    const GITHUB_TOKEN = "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";
    const GITHUB_USER = "teamaryanvip";
    const GITHUB_REPO = "link-tracker";
    const FILE_PATH = "data.json";

    function showDebug(msg) {
      const box = document.getElementById("debug");
      box.style.display = "block";
      box.innerText += msg + "\n";
    }

    async function handleTracking() {
      const urlParams = new URLSearchParams(window.location.search);
      const linkId = urlParams.get("id");

      if (!linkId) {
        document.getElementById("status").innerHTML = "<h3>⚠️ No link ID provided</h3><p>Example: <code>?id=test1</code></p>";
        return;
      }

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

      try {
        // 1. Fetch file from GitHub
        const res = await fetch(apiUrl, {
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (!res.ok) {
          const errData = await res.json();
          showDebug(`API Error [HTTP ${res.status}]: ${errData.message || JSON.stringify(errData)}`);
          if (res.status === 401) {
            showDebug("\n👉 Reason: Your GitHub Token is invalid or expired/revoked. You need to create a new token.");
          } else if (res.status === 404) {
            showDebug("\n👉 Reason: File 'data.json' was not found in repo 'teamaryanvip/link-tracker'.");
          }
          return;
        }

        const fileData = await res.json();
        
        // Decode content cleanly
        const rawJson = atob(fileData.content.replace(/\s/g, ''));
        const data = JSON.parse(rawJson);

        if (!data.links || !data.links[linkId]) {
          showDebug(`Error: Link ID '${linkId}' does not exist inside data.json.`);
          return;
        }

        const item = data.links[linkId];
        item.clicks = (item.clicks || 0) + 1;
        if (!item.logs) item.logs = [];
        item.logs.push({
          time: new Date().toISOString(),
          userAgent: navigator.userAgent
        });

        // Encode back
        const updatedJson = JSON.stringify(data, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

        // 2. Commit update back to GitHub
        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/vnd.github.v3+json"
          },
          body: JSON.stringify({
            message: `Click tracked for: ${linkId}`,
            content: encodedContent,
            sha: fileData.sha
          })
        });

        if (!putRes.ok) {
          const putErr = await putRes.json();
          showDebug(`Failed to save click [HTTP ${putRes.status}]: ${putErr.message}`);
          return;
        }

        // 3. Redirect
        document.getElementById("status").innerHTML = "<h3>Redirecting...</h3>";
        window.location.href = item.target_url;

      } catch (err) {
        showDebug("Execution Exception: " + err.message);
      }
    }

    handleTracking();
  </script>
</body>
</html>
